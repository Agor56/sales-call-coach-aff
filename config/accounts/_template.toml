# ElevenLabs voice agents. Easiest: run `./coach setup`, which fills this in for you.
# By hand: copy to config/accounts/<client>.toml (e.g. acme.toml), fill in, then add the key to .env.
# Run `./coach agents list --all --account <client>` to list the agent ids in that ElevenLabs account.

label = "Client name"
api_key_env = "ELEVENLABS_API_KEY_CLIENT"        # add ELEVENLABS_API_KEY_CLIENT=... to .env
base_url = "https://api.elevenlabs.io"
checklist = "config/checklist_a1.toml"           # write a client-specific checklist for your own script
description = "An AI voice agent that calls leads for <what you sell> and books a meeting with <who>."

[outcome]
version = "booked_v1"
rule = "booked"                                  # success = the booking tool ran without an error
booking_tool_prefix = "book_"                    # name (or start of the name) of the tool that books the meeting
min_annual_turnover_nis = 0
min_asset_value_nis = 0
callback_without_profile = "success"

[[agents]]
key = "main"
agent_id = "agent_..."
label = "Agent name"

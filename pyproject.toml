[project]
name = "sales-call-coach"
version = "0.1.0"
description = "Sales Call Coach: grades AI voice-agent sales calls (ElevenLabs), finds where calls are lost, and writes a daily coaching report with one fix to test."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "anthropic>=1.11.0,<2",
    "python-dotenv>=1.2.4,<2",
]

[project.scripts]
coach = "coach.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
